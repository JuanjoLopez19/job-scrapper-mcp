repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: pyrefly
        name: Pyrefly type check
        entry: uv run pyrefly check
        language: system
        pass_filenames: false
      - id: pytest
        name: Unit tests
        entry: uv run pytest -q
        language: system
        pass_filenames: false
